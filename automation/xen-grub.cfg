# Xen's GRUB settings. `make xen` installs this as /etc/default/grub.d/xen.cfg,
# with @XEN_CMDLINE@ replaced by XEN_CMDLINE from the Makefile.
#
# grub-mkconfig sources it after /etc/default/grub, so what is set here wins.
#
# Derived from drakvuf's package/extra/etc/default/grub.d/xen.cfg, which the
# drakvuf-builds xen-hypervisor package installed, WITHOUT its drakvuf-bundle
# check: once that package was removed the check ran `exit 0`, grub-mkconfig
# stopped while sourcing this file, wrote no grub.cfg and still exited 0. The
# check also sourced drak-find-xen-defaults, which computed Dom0's resources and
# overrode the boot line set by hand. docs/TROUBLESHOOTING.md has both.

GRUB_CMDLINE_XEN_DEFAULT="@XEN_CMDLINE@"
GRUB_CMDLINE_LINUX_XEN_REPLACE_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash"

# Boot the Xen entry by default. The xen-upstream package from `make debball`
# sets nothing here, and without this GRUB boots Ubuntu without Xen.
GRUB_DEFAULT=$(printf "$(gettext "%s, with Xen hypervisor")" "$GRUB_DISTRIBUTOR GNU/Linux")