# DRAKVUF clone volumes -- appended to /etc/lvm/lvmlocal.conf by `make sandboxd`
# (2026-11-03). That file is lvm2's place for settings local to one host; it
# is read after lvm.conf and overrides it, and Ubuntu ships it with comments
# only. The marker in the first line is what the Makefile greps before
# appending, so a re-run adds nothing.
#
# A clone volume holds whatever the sample wrote, and a PV label is a few
# hundred bytes a sample can forge. Without a filter, every clone that
# appears carries the same signature the golden image does, and lvm2's udev
# hook (`pvscan --cache`) may parse it and even auto-activate a guest volume
# group on Dom0 -- the review's M-11, confirmed only as the absence of any
# filter (C-12). This rejects the clones and leaves everything else as it
# was: the golden volumes stay visible because `make setup_hooks_ubuntu`
# attaches the golden Ubuntu's own VG deliberately, read-only, and detaches it.
#
# Clone names are `<origin>-<vlan>-clone` (sandboxd/naming.py), which
# device-mapper spells `vg--root-<origin>--<vlan>--clone`; the trailing digits
# cover a partition mapping someone made with kpartx by hand.
devices {
    global_filter = [
        "r|^/dev/mapper/vg--root-.*--clone[0-9]*$|",
        "r|^/dev/vg-root/.*-clone[0-9]*$|",
        "a|.*|"
    ]
}