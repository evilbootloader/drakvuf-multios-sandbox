# The Windows installers' mirror on the platform DomU (2026-11-04).
#
# A static directory nginx serves to Dom0 over the internal CA, so that
# `make win_installers` gets the file this lab verified once rather than
# whatever a vendor serves today. Chrome's download URL is an unversioned
# redirect, and the first Dom0 run of the target was refused one day after the
# pin because Google had shipped a release in between -- docs/TROUBLESHOOTING.md,
# "make win_installers refuses the build". Installed as
# /etc/nginx/conf.d/win-installers-mirror.conf by `make win_installers_mirror`,
# which renders @VMIP@ and @MIRROR_DIR@, fills the directory from Dom0's
# misc/iso/win-installers/ after every file passed automation/win-installers.list's
# hash check, and fetches every file back through this listener to verify it.
#
# LAN only. The Cloudflare tunnel's ingress names 8000 and 9000 and nothing
# else, so 9100 is not reachable from outside; anyone on the LAN can read these
# files. They are vendor installers, Chrome's enterprise MSI among them, which
# Google permits to be redistributed inside an organisation and not published,
# and that is also why they are not a GitHub release asset.
#
# The certificate is the object front's, s3bucket_web (SANs: the DomU's address,
# the lab's name, loopback), so Dom0 verifies it with the ca.crt that
# `make sandboxd` installed as /etc/sandboxd/tls/ca.crt. Deliberately NOT a
# location in objects.conf: that file is a security property of the object
# store with a conformance test, and a file server has no business inside it.
#
# An `http`-level fragment, like objects.conf: Debian includes conf.d/ inside
# http {}. Two lines are host-specific, the listen address and the alias, and
# both are rendered.
server {
    listen @VMIP@:9100 ssl;
    listen 127.0.0.1:9100 ssl;
    server_name @VMIP@ localhost;
    access_log /var/log/nginx/win-installers-mirror.log;

    ssl_certificate     /etc/nginx/tls/objects.crt;
    ssl_certificate_key /etc/nginx/tls/objects.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # Files by exact name, read-only, no listing: the names are in
    # automation/win-installers.list, and a directory index would hand a LAN
    # visitor an inventory for nothing.
    location /win-installers/ {
        alias @MIRROR_DIR@/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff;
    }
    location / { return 404; }
}
