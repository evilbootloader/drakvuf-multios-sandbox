# Custom responses of FakeNet-NG's raw listeners: none. `Custom:` in
# automation/fakenet.ini names this file; automation/fakenet_raw_silent.py has
# why. `make sandboxd` installs it as /etc/fakenet-custom.ini.
#
# RawListener matches a section to a listener by ListenerType, takes one per
# protocol, and resolves a relative path against the directory of fakenet.ini.

[RawTCPSilent]
ListenerType: TCP
TcpDynamic:   fakenet_raw_silent.py

[RawUDPSilent]
ListenerType: UDP
UdpDynamic:   fakenet_raw_silent.py
