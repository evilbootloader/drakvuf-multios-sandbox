# FakeNet-NG as the analysis network's fake Internet. DRAFT-057 Phase 3.
#
# Reference copy. Install on Dom0 and run it as a service; nothing in this
# repository deploys it -- the development container is not Dom0. The runbook
# is `docs/runbooks/13-verify-egress-modes.md`, step 6.
#
# Derived from mandiant/flare-fakenet-ng's own `fakenet/configs/default.ini`
# at tag v3.5, read 2026-09-01.
#
# ==========================================================================
# THIS FILE MUST BE COMPLETE. There is no merge with FakeNet's defaults.
# ==========================================================================
#
# `Fakenet.parse_config()` reads ONLY the file passed to `-c`; `default.ini`
# is what it falls back to when `-c` is absent, never something it merges in.
# Every section other than [FakeNet] and [Diverter] is a listener, so a config
# carrying only those two starts NOTHING -- it logs "Loaded configuration
# file", binds no port, and sits in its idle loop looking healthy.
#
# So the listener sections below are not decoration and not defaults restated
# for readability. Delete one and that protocol is gone.
#
# ==========================================================================
# IT ALSO REQUIRES automation/fakenet-divert-no.patch.
# ==========================================================================
#
# `DivertTraffic: No` is a path upstream does not appear to exercise: it
# leaves `self.diverter` at None and then dereferences it in three places, one
# of which is the first statement of the DNS responder. Unpatched, FakeNet
# starts, binds every port below, logs nothing alarming, and answers nothing.
# That reads in a report as a sample whose infrastructure was down. The patch
# header has the detail and the upstream issue.
#
# ==========================================================================
# TWO SETTINGS BELOW ARE LOAD-BEARING. Read this before changing either.
# ==========================================================================
#
# `LinuxFlushIptables` and `DivertTraffic` are both set opposite to FakeNet's
# defaults, and each default would break this lab in a different way.

[FakeNet]

# ---------------------------------------------------------------- DivertTraffic
#
# **No, and this is the whole integration.** FakeNet's default is Yes, which
# makes its diverter install its own blanket REDIRECT in PREROUTING.
#
# That rule would capture traffic from EVERY analysis VLAN, not just the ones
# running in `simulated`. A clone submitted as `offline` would then be answered
# by the responder -- `offline` would stop meaning offline, silently, and the
# report would show a sample happily talking to a fake Internet it was never
# supposed to reach. There is no louder symptom; it just looks like a result.
#
# With `No`, FakeNet "will still launch listeners, but will rely on another
# method to direct traffic to them" (its README). That other method is
# sandboxd, which installs a REDIRECT for ONE VLAN when a clone launches in
# this mode and removes it at teardown. Per-job selection is the entire point
# of DRAFT-057 and it cannot survive a process that redirects everything.
DivertTraffic: No

[Diverter]

# Linux, and the mode that treats this host as another machine's gateway --
# which is exactly what Dom0 is to a clone. MultiHost is Linux-only, and Dom0
# is Linux, so the guest OS is irrelevant to this choice.
#
# Spelled out rather than left at FakeNet's `Auto` for a non-obvious reason:
# `auto` is resolved to `multihost` inside the DivertTraffic branch, which we
# never enter, while every listener is handed `diverter_config['networkmode']`
# by direct subscript outside it. `Auto` here would reach the listeners as the
# literal string; an absent key would be a KeyError at startup.
NetworkMode: MultiHost

# ------------------------------------------------------------ LinuxFlushIptables
#
# **No. FakeNet's default is Yes and it would flush every iptables rule on this
# host**, including DRAKVUF_ISOLATION, DRAKVUF_INPUT and both IPv6 chains --
# the entire containment posture, for every clone currently running, while
# they run.
#
# Its README promises the old rules are restored "as long as its termination
# sequence is not interrupted". That conditional is the problem: a `kill -9`,
# an OOM, a crash or a host reset means they are never restored, and Dom0 comes
# back with malware VMs on an unfiltered network and nothing saying so.
#
# We install no rules FakeNet needs to make room for, so there is nothing for
# a flush to buy. See docs/TROUBLESHOOTING.md.
#
# Only the diverter reads this, so `DivertTraffic: No` already makes it
# unreachable. It stays set because it must be right on the day someone tries
# `DivertTraffic: Yes` to debug something, which is exactly the day nobody is
# reading this file.
LinuxFlushIptables: No

# The clone's resolver and gateway are set by sandboxd's preconfig stage at
# analysis time, and its default route already points at this host. Nothing here should
# reach into the guest or into Dom0's own resolver configuration.
#
# `ModifyLocalDNS` and `StopDNSService` in particular would edit DOM0's
# /etc/resolv.conf and stop its resolver -- on the hypervisor, to serve a
# guest that never asked. FixGateway and FixDNS are SingleHost conveniences
# for a machine analysing itself; MultiHost has a real gateway already.
#
# Diverter-only, like LinuxFlushIptables above, and set for the same reason.
ModifyLocalDNS: No
StopDNSService: No
FixGateway: No
FixDNS: No

# FakeNet's own pcap. Off: sandboxd already captures the clone's entire
# VLAN sub-interface per run (`guests.argv_tcpdump`), and that capture is the
# evidence the pipeline
# collects and uploads. A second, differently-scoped capture written somewhere
# else is a file nobody reads and a disk nobody watches.
DumpPackets: No

# The catch-all, as FakeNet's diverter would express it. Diverter-only, so
# under `DivertTraffic: No` these three do nothing at all: what actually sends
# every port to the proxy is sandboxd's own REDIRECT rule, built from
# `config.FAKENET_PROXY_PORT`. They stay for the same reason as the settings
# above, and because the proxy port they name is the one our rules target.
RedirectAllTraffic: Yes
DefaultTCPListener: ProxyTCPListener
DefaultUDPListener: ProxyUDPListener

# ==========================================================================
# Listeners
# ==========================================================================
#
# Every listener binds 0.0.0.0, and cannot be made to do otherwise: FakeNet
# overwrites each listener's address with one process-wide value, and a
# REDIRECT rewrites the destination to the INCOMING interface's address, which
# is a different gateway for every VLAN. A loopback bind would receive nothing
# from a clone. `network-setup.sh` DROPs these ports on the uplink for exactly
# the reason it does tor's 9040 and 9053 -- see its INPUT chain.
#
# ORDER MATTERS, and only here. The proxy picks a listener by calling taste()
# on each in turn and keeping the highest confidence, breaking ties by
# whichever ran first, which is this file's order. Under `DivertTraffic: No`
# the original destination port is unrecoverable, so every taste() loses its
# port bonus and scores on content alone: +2 for a protocol it recognises, +1
# for FTP, and a flat 1 from RawListener for literally anything. FTP therefore
# ties with Raw and MUST precede it. The protocol listeners come first, Raw
# last, and that is the whole rule.

# ------------------------------------------------------------------- the proxy
#
# What sandboxd's one REDIRECT rule points at, for every TCP port and every
# UDP port except 53. The proxy identifies the protocol from the content and
# hands off internally, which is what lets our chains stay one rule wide
# instead of carrying a copy of the port table below -- a copy free to drift,
# with "the sample's traffic went unanswered" as the only symptom.
#
# 38926 for both is FakeNet's own default. `config.FAKENET_PROXY_PORT` must
# agree; sandboxd/tests/test_egress.py checks that it does.
#
# `Listeners:` is advisory. The dispatcher tastes every listener that started,
# not this list, so a protocol is enabled by its section below and not by
# being named here.
#
# ------------------------------------------------------------------- Cert_Dir
#
# **Absolute, and the default is not.** Unset, `ProxyListener` falls back to
# the relative `configs/temp_certs`, which `ssl_utils.abs_config_path()`
# resolves with `os.path.abspath()` -- and on Python 3.12 that calls
# `os.getcwd()` for a relative path only. FakeNet therefore inherits a
# dependency on the directory it was LAUNCHED from, forever.
#
# When that directory is later removed, the SNI callback dies with
# `FileNotFoundError: [Errno 2]` from `getcwd()`, the handshake aborts with
# `SSLError: [SSL: CALLBACK_FAILED]`, and neither message names a directory or
# a config key. Observed on Dom0 2026-09-01. An absolute path takes the
# `isabs()` branch, `getcwd()` is never called, and where FakeNet was started
# stops mattering.
#
# FakeNet creates this directory itself at startup and `shutil.rmtree()`s it on
# a clean exit, so it needs no provisioning and holds nothing to preserve.
#
# **The filenames in here were sample-controlled until 2026-09-04.**
# `create_cert()` builds `os.path.join(cert_dir, "%s.crt" % cn)` where `cn` is
# the SNI servername from the clone's own handshake. A `/` survives Python's
# server-side decoding -- verified 2026-09-01 -- so a sample choosing its own
# SNI chose part of a path on the HYPERVISOR, and FakeNet is root there.
#
# Closed by change 6 of `automation/fakenet-divert-no.patch`, which admits a
# hostname and treats anything else as an absent SNI, and by
# `automation/fakenet.service`'s ProtectSystem/ReadWritePaths, which makes a
# write outside /var/lib/fakenet fail with EROFS whatever names it.
#
# **Closed in this repository, which is not the same as closed on Dom0.** Both
# halves are files an operator installs: a host that has not re-applied the
# patch and reinstalled the unit still has the gap, and looks no different
# while it does. Runbook 13 step 6b's fourth grep is how you tell.
#
# **This note used to say "writes outside an existing directory fail rather
# than traverse". That was wrong, and wrong in the reassuring direction:** it
# is true only of a parent that does not exist. `/etc`, `/etc/ssl/certs` and
# `/root` all exist, and a traversal into any of them succeeded. An absolute
# Cert_Dir fixes where the attempt starts and was never sanitisation.
# docs/TROUBLESHOOTING.md carries the long version.

[ProxyTCPListener]
Enabled:     True
Protocol:    TCP
Listener:    ProxyListener
Port:        38926
Listeners:   HTTPListener, RawListener, FTPListener, DNSListener, POPListener, SMTPListener, TFTPListener, IRCListener
Static_CA:   No
Cert_Dir:    /var/lib/fakenet/certs

[ProxyUDPListener]
Enabled:     True
Protocol:    UDP
Listener:    ProxyListener
Port:        38926
Listeners:   RawListener, DNSListener, TFTPListener, FTPListener

# ----------------------------------------------------------------------- DNS
#
# The one listener sandboxd redirects to DIRECTLY rather than through the
# proxy. One extra rule, and it buys certainty about the single most
# load-bearing protocol in a sandbox: a sample that cannot resolve its C2
# domain does nothing at all, and the report looks like a dull sample rather
# than a broken responder.
#
# `ResponseA` is TEST-NET-1 (RFC 5737): documented as unroutable, so if this
# address ever escapes the lab it goes nowhere. The value itself does not
# matter to the redirect -- our PREROUTING rules match on interface and
# protocol, never on destination -- so whatever a sample is told to connect
# to, it arrives at the proxy.
#
# `NXDomains: 0`: answer every query. The upstream default of cycling a few
# NXDOMAINs first to make malware walk its backup C2 list is a good idea for
# an analyst at a console and a bad one here, where the report has to say
# whether the sample resolved anything.
#
# **Not 53, because Dom0 runs systemd-resolved.** Its stub holds 127.0.0.53:53
# and this server sets no SO_REUSEADDR, so a 0.0.0.0:53 bind loses -- confirmed
# on Dom0 2026-09-01 with `[Errno 98] Address already in use`, which is fatal
# to the whole process rather than to one listener (`sys.exit(1)`).
#
# The guest is unaffected: sandboxd's rule still MATCHES the clone's `--dport
# 53` and only redirects it here, so nothing in any preconfig script changes.
# Keep this equal to `config.FAKENET_DNS_PORT` -- sandboxd/tests/test_egress.py
# fails when they drift -- and keep it below 32768, outside
# `ip_local_port_range`, so one of Dom0's own outbound connections cannot be
# holding it when FakeNet starts.

[DNS Server]
Enabled:     True
Port:        5300
Protocol:    UDP
Listener:    DNSListener
ResponseA:   192.0.2.123
ResponseMX:  mail.evil2.com
ResponseTXT: FAKENET
NXDomains:   0

# ---------------------------------------------------------------------- HTTP
#
# `Webroot` is read-only and resolves to the installed package's own
# defaultFiles, which is where the canned responses for unknown paths live
# too -- point it somewhere emptier and a GET for a missing file has nothing
# to fall back on.
#
# `DumpHTTPPosts: No` for the same reason as `DumpPackets` above: a POST body
# is already in the per-VLAN pcap the pipeline uploads, and the alternative is
# sample-controlled content written to whatever directory FakeNet was started
# from.
#
# **HTTPS still works, and this listener is what serves it.** The proxy is
# the TLS endpoint: it detects the handshake, wraps the socket with a
# generated certificate, decrypts, and only then tastes the bytes -- so what
# reaches a listener is plaintext HTTP either way, over a plain TCP connection
# the proxy opens itself. It never re-wraps TLS towards the listener.
#
# That is why [HTTPListener443] is disabled rather than enabled. It shares
# HTTPListener's taste(), so it scores identically to this section on every
# request, and ties go to whichever started first -- this file's order, not
# chance. Enabled below this one it can never be chosen: dead weight, plus an
# 0.0.0.0:443 bind on Dom0 to firewall and one more chance of the bind failing
# and taking all of FakeNet with it. Enabled ABOVE this one it wins every
# request and is handed plaintext on an SSL listener, which breaks all HTTP
# rather than only HTTPS. Nothing reaches port 443 directly under our rules,
# so there is no third case where it helps.
#
# What it costs: FakeNet's own NBI log records these as `usessl: No`. Nothing
# reads that here -- the diverter that consumes it is not running -- and the
# per-VLAN pcap shows the TLS on the wire regardless.

[HTTPListener80]
Enabled:     True
Port:        80
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      No
Webroot:     defaultFiles/
Timeout:     10
DumpHTTPPosts: No

[HTTPListener443]
Enabled:     False

# ------------------------------------------------- the rest of the protocols
#
# Reached only through the proxy, never directly, so their port numbers are
# FakeNet's own defaults and nothing in this repository refers to them.
#
# **FTProot and TFTPRoot are WRITABLE BY THE SAMPLE.** FTPListener accepts any
# username and password and grants the resulting account `elradfmwM` -- store,
# delete, rename, mkdir -- on whatever FTProot names, and TFTPListener writes
# uploads under TFTPRoot. Left at the upstream default of `defaultFiles/` that
# is the installed package directory, which would let a sample under analysis
# write into Dom0's Python site-packages. Both point at a disposable directory
# instead; the runbook creates it. Nothing in it is analysis evidence -- what
# a sample uploaded is in the pcap -- so it can be emptied at any time.
#
# TFTP filenames are percent-encoded before use (`quote(name, safe='')`), so
# they cannot traverse out of that directory. FTP paths are pyftpdlib's to
# confine, which is a second reason for the root to be somewhere disposable.

[SMTPListener]
Enabled:     True
Port:        25
Protocol:    TCP
Listener:    SMTPListener
UseSSL:      No

[FTPListener21]
Enabled:     True
Port:        21
Protocol:    TCP
Listener:    FTPListener
UseSSL:      No
FTProot:     /var/lib/fakenet/root
PasvPorts:   60000-60010
Banner:      !generic
ServerName:  !gethostname

[POPServer]
Enabled:     True
Port:        110
Protocol:    TCP
Listener:    POPListener
UseSSL:      No

[IRCServer]
Enabled:     True
Port:        6667
Protocol:    TCP
Listener:    IRCListener
UseSSL:      No
Banner:      !generic
ServerName:  !gethostname
Timeout:     30

[TFTPListener]
Enabled:     True
Port:        69
Protocol:    UDP
Listener:    TFTPListener
TFTPRoot:    /var/lib/fakenet/root
TFTPFilePrefix:  tftp

# ------------------------------------------------------------ the fallback
#
# LAST, and that is the point: RawListener.taste() returns 1 for any bytes at
# all, so anything the protocol listeners above did not recognise lands here
# rather than getting silence. A sample beaconing its own format on port 4444
# gets a connection that accepts and answers instead of one that closes.
#
# Port 1337 is never reached directly -- our rules send everything to the
# proxy -- so the number only has to be free and to match nothing else here.
#
# [Forwarder], [FilteredListener] and [FTPListenerPASV] from upstream's
# default.ini are deliberately absent: the first two ship disabled, and the
# third has no `Listener:` key, which makes it a hint to the diverter we do
# not run rather than a socket. Passive-mode FTP data connections are
# redirected to the proxy like everything else and tasted as raw bytes.

[RawTCPListener]
Enabled:     True
Port:        1337
Protocol:    TCP
Listener:    RawListener
UseSSL:      No
Timeout:     10

[RawUDPListener]
Enabled:     True
Port:        1337
Protocol:    UDP
Listener:    RawListener
UseSSL:      No
Timeout:     10
