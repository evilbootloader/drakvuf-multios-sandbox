# FakeNet-NG as the analysis network's fake Internet. DRAFT-057 Phase 3.
#
# Reference copy. Install on Dom0 and run it as a service; nothing in this
# repository deploys it -- the development container is not Dom0. The runbook
# is docs/runbooks/ (see `13-verify-egress-modes.md`).
#
# Derived from mandiant/flare-fakenet-ng's own `fakenet/configs/default.ini`,
# read 2026-08-31. Only the options that MATTER here are set; everything else
# is left at FakeNet's defaults deliberately, so that upgrading it does not
# require re-deciding settings we never had an opinion about.
#
# ==========================================================================
# TWO SETTINGS BELOW ARE LOAD-BEARING. Read this before changing either.
# ==========================================================================
#
# `LinuxFlushIptables` and `DivertTraffic` are both set opposite to FakeNet's
# defaults, and each default would break this lab in a different way.

[FakeNet]

# ---------------------------------------------------------------- DivertTraffic
#
# **No, and this is the whole integration.** FakeNet's default is Yes, which
# makes its diverter install its own blanket REDIRECT in PREROUTING.
#
# That rule would capture traffic from EVERY analysis VLAN, not just the ones
# running in `simulated`. A clone submitted as `offline` would then be answered
# by the responder -- `offline` would stop meaning offline, silently, and the
# report would show a sample happily talking to a fake Internet it was never
# supposed to reach. There is no louder symptom; it just looks like a result.
#
# With `No`, FakeNet "will still launch listeners, but will rely on another
# method to direct traffic to them" (its README). That other method is
# sandboxd, which installs a REDIRECT for ONE VLAN when a clone launches in
# this mode and removes it at teardown. Per-job selection is the entire point
# of DRAFT-057 and it cannot survive a process that redirects everything.
DivertTraffic: No

[Diverter]

# Linux, and the mode that treats this host as another machine's gateway --
# which is exactly what Dom0 is to a clone. MultiHost is Linux-only, and Dom0
# is Linux, so the guest OS is irrelevant to this choice.
NetworkMode: MultiHost

# ------------------------------------------------------------ LinuxFlushIptables
#
# **No. FakeNet's default is Yes and it would flush every iptables rule on this
# host**, including DRAKVUF_ISOLATION, DRAKVUF_INPUT and both IPv6 chains --
# the entire containment posture, for every clone currently running, while
# they run.
#
# Its README promises the old rules are restored "as long as its termination
# sequence is not interrupted". That conditional is the problem: a `kill -9`,
# an OOM, a crash or a host reset means they are never restored, and Dom0 comes
# back with malware VMs on an unfiltered network and nothing saying so.
#
# We install no rules FakeNet needs to make room for, so there is nothing for
# a flush to buy. See docs/TROUBLESHOOTING.md.
LinuxFlushIptables: No

# The clone's resolver and gateway are set by preconfig-<os>.sh at analysis
# time, and its default route already points at this host. Nothing here should
# reach into the guest or into Dom0's own resolver configuration.
#
# `ModifyLocalDNS` and `StopDNSService` in particular would edit DOM0's
# /etc/resolv.conf and stop its resolver -- on the hypervisor, to serve a
# guest that never asked. FixGateway and FixDNS are SingleHost conveniences
# for a machine analysing itself; MultiHost has a real gateway already.
ModifyLocalDNS: No
StopDNSService: No
FixGateway: No
FixDNS: No

# FakeNet's own pcap. Off: `tcpdump.sh` already captures the clone's entire
# VLAN sub-interface per run, and that capture is the evidence the pipeline
# collects and uploads. A second, differently-scoped capture written somewhere
# else is a file nobody reads and a disk nobody watches.
DumpPackets: No

# The catch-all. `Proxy*Listener` identifies the protocol from the content and
# hands off to the right listener, which is what lets sandboxd redirect every
# port with ONE rule instead of carrying a copy of the listener table below.
RedirectAllTraffic: Yes
DefaultTCPListener: ProxyTCPListener
DefaultUDPListener: ProxyUDPListener

# Listeners are left at FakeNet's defaults -- DNS on 53, HTTP on 80 and 443,
# SMTP 25, FTP 21, IRC 6667, POP 110, TFTP 69, and the proxies on 38926.
#
# sandboxd's rules name only 53 and 38926. Everything else is reached THROUGH
# the proxy, so this file can gain or lose a listener without any change to the
# firewall rules -- which is the coupling this arrangement exists to avoid.
