# Android sandbox TEMPLATE domain -- not an analysis instance.
#
# Samples do not run here either. automation/clone.pl takes an LVM
# copy-on-write snapshot of this domain's LV and restores its saved memory
# image (android_sandbox.bak) to produce one disposable clone per sample.
# That clone is where analysis happens.
#
# The clone script is the SHARED one, not a per-OS clone-android.pl --
# there is no such file and there will not be (DRAFT-015, 2026-08-15). It
# is handed this config by name and derives everything else from its three
# arguments, so nothing in it knows this domain is Android.
#
# Unlike the Ubuntu pair, this template is still not fully driven by
# automation: preconfig-android.sh and drakvuf-android.sh do not exist
# (DRAFT-016). See docs/checklists/android.md Phase 2.

arch = 'x86_64'
name = "android_sandbox"
maxmem = 4096
memory = 4096
# One vCPU -- see the rationale in the golden .cfg.
#
# **CHANGING THIS FILE ALONE DOES NOTHING.** `xl restore` takes the vCPU count
# from the saved memory image (`state/<domain>.bak`), not from this config, so
# the template must be re-saved from a golden domain booted with `vcpus = 1`
# before the change has any effect. A mismatch between the two is not a silent
# fallback: it is a restore that disagrees with the state it is restoring.
vcpus = 1
maxvcpus = 1

# Hard CPU affinity: this clone's vCPUs may run only on pCPU 12 and 14.
#
# **The other half of `dom0_vcpus_pin`.** That option pins Dom0 INTO its pCPUs;
# it does not RESERVE them. An unpinned guest is scheduled wherever Xen likes,
# including on top of Dom0 -- and since a trapped syscall pauses its vCPU until
# Dom0 has serviced it, a clone competing with Dom0 for a pCPU is competing
# with the very thing it is waiting for (§F1).
#
# **Derive this from the ONLINE pCPU set, not from a range.** On bare metal
# with `smt=0` Xen parks every SMT sibling, so the online CPUs are sparse:
# P-cores are the EVENS 0-14 and E-cores are 16-31. `dom0_vcpus_pin` therefore
# gives Dom0 the first six ONLINE pCPUs -- 0,2,4,6,8,10 -- not 0-5.
#
# **GENERATED from CLONE_PCPUS in automation/platform.env.** Edit it there and
# run scripts/gen-xen-configs.py; a test fails if this line drifts. The value
# has to agree with the Xen boot line and with misc/platform.cfg, and
# disagreement is silent -- a clone sharing Dom0's cores still runs, it just
# contends with the DRAKVUF process tracing it.
#
# A range resolves against ONLINE pCPUs, which is the trap this line has
# already fallen into twice. It read "6-11" from the nested topology, where Xen
# saw a contiguous 0-11; on this host that means {6,8,10}, all three of them
# Dom0's, so clones silently shared every core with the DRAKVUF event loop.
# Ranges are safe across 16-31 because no sibling is parked there.
# Confirm before changing:  xl cpupool-list -c
#
# E-cores, adopted 2026-08-31 with Dom0 on all eight P-cores. They cost nothing
# measurable: 12-baremetal-trial.md H2 put clones on E-cores at -0.5% against
# the P-core baseline, inside the 0.6% run-to-run spread. C3a's 1.7x is a busy-
# loop figure and does not transfer -- F7 measured clone vCPUs paused ~93% of
# wall time. The guest is less responsive interactively; throughput is what the
# pipeline is for.
#
# Twelve cores also stop capping concurrency: the previous "12,14" gave every
# clone two shared P-cores. Memory binds now, not cores.
#
# Unlike `vcpus`, this needs NO template re-save. vCPU affinity is a runtime
# property libxl applies from this config at restore; only the vCPU *count*
# comes from the saved memory image.
cpus = "16-27"
builder = "hvm"
boot = "c"
# Hardware-assisted paging -- precondition for altp2m below.
hap = 1
# Torn down on crash or watchdog, unlike the golden android domain, which
# preserves both: this template is rebuildable from the golden VM, so a
# wedged copy is not worth keeping around holding an LV open.
on_reboot   = "restart"
on_crash    = "destroy"
on_poweroff = "destroy"
on_watchdog = "destroy"
vnc = 1
vnclisten = "127.0.0.1"
vga = "stdvga"
usb = 1
usbdevice = "tablet"
audio = 1
# Audio passthrough into the analysis guest is planned but not implemented.
# Do not delete this line -- it records the intent. `soundhw` is not the
# mechanism: QEMU removed it in 6.0, so uncommenting it fails at domain
# creation rather than degrading. Passing the host audio controller means
# xen-pciback binding on Dom0 plus a pci = [...] entry here, which is a
# containment decision rather than a config change.
#soundhw = "hda"
# DRAKVUF introspection settings. Do not change without re-testing that a
# trace still attaches: a wrong value here yields a domain that boots and
# runs normally but cannot be introspected, which fails at analysis time
# rather than at domain creation.
#   viridian = 1        Hyper-V enlightenments. The house template across
#                       all four configs, inherited by the Windows guest.
#   altp2m = 2          external mode -- required for stealth breakpoints.
#   shadow_memory = 32  sized for altp2m's additional EPT views, not for
#                       the guest's own working set.
viridian = 1
altp2m = 2
shadow_memory = 32
# Analysis bridge, with the OVS vif script. automation/clone.pl rewrites
# this line to append bridge=xenbr1.<vlan> so each clone lands on its own
# isolated VLAN sub-interface. Verified against this exact file 2026-08-15:
# the rewrite reproduces byte-for-byte what
# docs/runbooks/verify-android-isolation.md step 2 wrote out by hand.
vif = [ 'type=ioemu,model=e1000,script=vif-openvswitch,bridge=xenbr1' ]
disk = [ 'phy:/dev/vg-root/android_sandbox,hda,w' ]
