# Golden Windows analysis VM -- the install source, built once from the ISO
# below. Samples are never run in this domain; the windows_sandbox template
# is what gets cloned.
# KNOWN GAP (DRAFT-034): windows_sandbox and misc/windows_sandbox.cfg do not
# exist yet, so nothing clones this domain today. Build procedure, LibVMI
# profile generation via pdbconv.py, and the licensing position:
# docs/checklists/windows.md.

arch = 'x86_64'
name = "windows"
maxmem = 6144
memory = 6144
# Two vCPUs, where Ubuntu and Android get one (2026-08-27). Same reasoning as
# theirs -- a trapped syscall pauses its vCPU, so every extra vCPU multiplies
# the trap rate -- but Windows boots and stays responsive far worse on a single
# core, and this track has no execution evidence yet to trade against. Was 6.
#
# Unmeasured on Dom0, like everything else in this file. If the Windows track
# reaches a trace and it is unusably slow, this is the first thing to try at 1.
vcpus = 2
maxvcpus = 2
builder = "hvm"
boot = "c"
# Hardware-assisted paging -- precondition for altp2m below.
hap = 1
# A crashed or hung golden VM is kept for post-mortem rather than torn
# down -- it represents a manual, multi-hour Windows install carrying an
# activated licence, which cannot be recreated cheaply. The windows_sandbox
# template will use "destroy" for both, since it is rebuildable from this
# domain.
on_reboot   = "restart"
on_crash    = "preserve"
on_poweroff = "destroy"
on_watchdog = "preserve"
vnc = 1
vnclisten = "127.0.0.1"
vga = "stdvga"
usb = 1
usbdevice = "tablet"
audio = 1
# Audio passthrough into the analysis guest is planned but not implemented.
# Do not delete this line -- it records the intent. `soundhw` is not the
# mechanism: QEMU removed it in 6.0, so uncommenting it fails at domain
# creation rather than degrading. Passing the host audio controller means
# xen-pciback binding on Dom0 plus a pci = [...] entry here, which is a
# containment decision rather than a config change.
#soundhw = "hda"
# DRAKVUF introspection settings. Do not change without re-testing that a
# trace still attaches: a wrong value here yields a domain that boots and
# runs normally but cannot be introspected, which fails at analysis time
# rather than at domain creation.
#   viridian = 1        Hyper-V enlightenments. The house template across
#                       all configs; this is the guest it was chosen for.
#   altp2m = 2          external mode -- required for stealth breakpoints.
#   shadow_memory = 32  sized for altp2m's additional EPT views, not for
#                       the guest's own working set.
viridian = 1
altp2m = 2
shadow_memory = 32
# Golden VMs sit on the uplink bridge with no VLAN and no OVS vif script.
# Only sandbox clones use xenbr1 -- see misc/ubuntu_sandbox.cfg for the
# shape misc/windows_sandbox.cfg will take.
vif = [ 'type=ioemu,model=e1000,bridge=xenbr0' ]
# The cdrom entry is install media, read only when building this golden VM
# from scratch. `boot = "c"` above boots the disk; installing from this ISO
# for the first time needs it temporarily set to "dc".
#
# Note what this path is NOT. *.iso is gitignored, so the file is not a
# repository-owned asset and a fresh checkout will not have it; the
# location is also hard-coded to the documented Dom0 checkout rather than
# derived from this file's own location, so a checkout anywhere else needs
# this line edited. Both are acceptable because nothing in the analysis
# pipeline reads this line: sandbox clones never see it, and clone.pl
# rewrites disk= wholesale. It blocks exactly one operation -- reinstalling
# the golden Windows VM from cdrom -- which is a manual, deliberate act
# performed on Dom0.
disk = [ 'phy:/dev/vg-root/windows,hda,w', 'file:/root/drakvuf-multios-sandbox/misc/Win11_25H2_Spanish_x64_v2.iso,hdc:cdrom,r' ]