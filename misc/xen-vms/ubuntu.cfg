arch = 'x86_64'
name = 'ubuntu_analysis'
maxmem = 4096
memory = 4096
vcpus = 2
maxvcpus = 2
builder = 'hvm'
boot = 'cd'
hap = 1
on_poweroff = 'destroy'
on_reboot = 'restart'
on_crash = 'destroy'
vnc = 1
vnclisten = '0.0.0.0'
vga = 'stdvga'
usb = 1
usbdevice = 'tablet'
audio = 1
viridian = 1
altp2m = 2
shadow_memory = 32
vif = [ 'type=ioemu,model=e1000,bridge=xenbr0' ]
disk = ['phy:/dev/vg-root/ubuntu_test,hda,w','file:/root/drakvuf-multios-sandbox/misc/iso/seed.iso,hdb:cdrom,r','file:/root/drakvuf-multios-sandbox/misc/iso/ubuntu-24.04.5.1-desktop-amd64.iso,hdc:cdrom,r']
