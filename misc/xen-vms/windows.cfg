arch = 'x86_64'
name = 'windows_analysis'
maxmem = 6144
memory = 6144
vcpus = 2
maxvcpus = 2
builder = 'hvm'
boot = 'cd'
hap = 1
on_poweroff = 'destroy'
on_reboot = 'restart'
on_crash = 'destroy'
vnc = 1
vnclisten = '0.0.0.0'
vga = 'stdvga'
usb = 1
usbdevice = 'tablet'
audio = 1
viridian = 1
altp2m = 2
shadow_memory = 32
vif = [ 'type=ioemu,model=e1000,bridge=xenbr0' ]
disk = [ 'phy:/dev/vg-root/windows,hda,w', 'file:/root/drakvuf-multios-sandbox/misc/iso/Win11_modified.iso,hdc:cdrom,r' ]
