# Golden Ubuntu analysis VM -- the install source, built once from the ISO
# below. Samples are never run in this domain: sandboxd clones the
# ubuntu_sandbox template instead, never this one.
# See docs/architecture/analysis-pipeline.md.

arch = 'x86_64'
name = "ubuntu"
maxmem = 4096
memory = 4096
# One vCPU. Was `2` until 2026-08-27.
#
# **This is hygiene, not a performance fix, and the distinction is measured.**
# `xentop` on Dom0 that day showed both templates with `VCPUS 2` but only
# `0:` in the per-vCPU breakdown -- xentop reports `max_vcpu_id + 1` and skips
# vCPUs that are OFFLINE, so vCPU 1 was allocated and never brought up by the
# guest. An offline vCPU executes nothing and traps nothing, so dropping it
# does not reduce the trap rate. It was never contributing one.
#
# What it does buy: a sample cannot online CPU1 through sysfs part-way through
# an analysis and change the shape of the trace, and DRAKVUF stops iterating a
# vCPU that will never run. The throttling that prompted the change is
# addressed by pinning instead -- see
# docs/runbooks/verify-sandboxd-and-console.md §F.
#
# This is the GOLDEN domain, created with `xl create`, so the count takes
# effect here directly. The sandbox template must then be re-saved from a
# domain booted with it -- see the note in the matching _sandbox.cfg.
vcpus = 1
maxvcpus = 1
builder = "hvm"
boot = "c"
# Hardware-assisted paging -- precondition for altp2m below.
hap = 1
on_poweroff = "destroy"
on_reboot = "restart"
on_crash = "destroy"
vnc = 1
vnclisten = "127.0.0.1"
vga = "stdvga"
usb = 1
usbdevice = "tablet"
audio = 1
# Audio passthrough into the analysis guest is planned but not implemented.
# Do not delete this line -- it records the intent. `soundhw` is not the
# mechanism: QEMU removed it in 6.0, so uncommenting it fails at domain
# creation rather than degrading. Passing the host audio controller means
# xen-pciback binding on Dom0 plus a pci = [...] entry here, which is a
# containment decision rather than a config change.
#soundhw = "hda"
# DRAKVUF introspection settings. Do not change without re-testing that a
# trace still attaches: a wrong value here yields a domain that boots and
# runs normally but cannot be introspected, which fails at analysis time
# rather than at domain creation.
#   viridian = 1        Hyper-V enlightenments. The house template across
#                       all four configs, inherited by the Windows guest.
#   altp2m = 2          external mode -- required for stealth breakpoints.
#   shadow_memory = 32  sized for altp2m's additional EPT views, not for
#                       the guest's own working set.
viridian = 1
altp2m = 2
shadow_memory = 32
# Golden VMs sit on the uplink bridge with no VLAN and no OVS vif script.
# Only sandbox clones use xenbr1 -- see misc/ubuntu_sandbox.cfg.
vif = [ 'type=ioemu,model=e1000,bridge=xenbr0' ]
# The cdrom entry is install media and is read only when building this
# golden VM from scratch. Issue #4 deliberately left it as a host path:
# it is not a repository-owned asset (a 4GB ISO, ignored by .gitignore),
# so making it $REPO_ROOT-relative would point at a file that is never
# there. Adjust it by hand if you reinstall; nothing in the analysis
# pipeline reads it. Sandbox clones never see it at all --
# misc/ubuntu_sandbox.cfg has no cdrom, and sandboxd/clone.py rewrites
# disk= wholesale when generating a clone.
disk = [ 'phy:/dev/vg-root/ubuntu,hda,w', 'file:/home/user/Documents/ubuntu-22.04.5-desktop-amd64.iso,hdc:cdrom,r' ]