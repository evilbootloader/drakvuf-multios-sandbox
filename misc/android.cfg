# Golden Android (BlissOS x86_64) analysis VM -- the install source, built
# once from the ISO below. Samples are never run in this domain; the
# android_sandbox template is what gets cloned.
# Build provenance for the ISO: misc/Artifacts/. Build procedure and
# profile generation: docs/android_setup.md.

arch = 'x86_64'
name = "android"
maxmem = 2048
memory = 2048
vcpus = 2
maxvcpus = 2
builder = "hvm"
boot = "c"
# Hardware-assisted paging -- precondition for altp2m below.
hap = 1
# A crashed or hung golden VM is kept for post-mortem rather than torn
# down -- it represents a manual, multi-hour BlissOS install that cannot be
# recreated cheaply. The android_sandbox template uses "destroy" for both,
# since it is rebuildable from this domain.
on_reboot   = "restart"
on_crash    = "preserve"
on_poweroff = "destroy"
on_watchdog = "preserve"
vnc = 1
vnclisten = "127.0.0.1"
vga = "stdvga"
usb = 1
usbdevice = "tablet"
audio = 1
# Audio passthrough into the analysis guest is planned but not implemented.
# Do not delete this line -- it records the intent. `soundhw` is not the
# mechanism: QEMU removed it in 6.0, so uncommenting it fails at domain
# creation rather than degrading. Passing the host audio controller means
# xen-pciback binding on Dom0 plus a pci = [...] entry here, which is a
# containment decision rather than a config change.
#soundhw = "hda"
# DRAKVUF introspection settings. Do not change without re-testing that a
# trace still attaches: a wrong value here yields a domain that boots and
# runs normally but cannot be introspected, which fails at analysis time
# rather than at domain creation.
#   viridian = 1        Hyper-V enlightenments. The house template across
#                       all four configs, inherited by the Windows guest.
#   altp2m = 2          external mode -- required for stealth breakpoints.
#   shadow_memory = 32  sized for altp2m's additional EPT views, not for
#                       the guest's own working set.
viridian = 1
altp2m = 2
shadow_memory = 32
# Golden VMs sit on the uplink bridge with no VLAN and no OVS vif script.
# Only sandbox clones use xenbr1 -- see misc/android_sandbox.cfg.
vif = [ 'type=ioemu,model=e1000,bridge=xenbr0' ]
# The cdrom entry is install media, read only when building this golden VM
# from scratch.
#
# FIXED 2026-08-14. The path was broken from 2026-08-09, when issue #4's
# deployment renamed the old checkout to
# /home/user/drakvuf-tools.retired-issue4 and took the ISO with it. It now
# points at the EthernetConfig rebuild -- see docs/android_setup_good.md
# for how that image is built, and why the golden VM was reinstalled.
#
# Note what this path is NOT. *.iso is gitignored, so the file is not a
# repository-owned asset and a fresh checkout will not have it; the
# location is also hard-coded to the documented Dom0 path rather than
# derived from this file's own location, so a checkout anywhere else needs
# this line edited. Both are acceptable here for the same reason the break
# went unnoticed for five days: nothing in the analysis pipeline reads this
# line. Sandbox clones never see it, and clone-*.pl rewrites disk=
# wholesale. It blocks exactly one operation -- reinstalling the golden
# Android VM from cdrom -- which is a manual, deliberate act performed on
# Dom0.
disk = [ 'phy:/dev/vg-root/android,hda,w', 'file:/root/sandbox_project/misc/Bliss-v17.8.3-x86_64-UNOFFICIAL-vanilla-20260814.iso,hdc:cdrom,r' ]
# Serial console for BlissOS boot diagnostics during the manual install.
# The sandbox template does not carry this.
serial = "pty"
