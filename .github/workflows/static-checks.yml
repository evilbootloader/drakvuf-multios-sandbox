# Level 1 static checks — DRAFT-026a.
#
# Design: docs/workflow-ci.md, "GitHub-hosted workflows (Level 1)".
# Unblocked by DRAFT-031, which made `shellcheck automation/*.sh` exit 0
# against the .shellcheckrc baseline. Before that this workflow would have
# been red on every run against unmodified working code.
#
# This tier runs with no privileged access and no Xen. It deliberately does
# NOT compile dirwatch.c: that file #includes <config.h> and
# ../xen_helper/xen_helper.h and only builds inside a real DRAKVUF source
# tree with Xen dev headers. That compile is Level 2's job.
#
# It also cannot prove the automation scripts still *execute* correctly —
# only that they parse. The Dom0 benign-analysis run remains the execution
# evidence, and no CI tier substitutes for it.
#
# ---------------------------------------------------------------------------
# ACTION VERSIONS AND THE RUNNER FLOOR
#
# checkout@v7, setup-python@v7 and cache@v6 all run on Node 24, and every one
# of those majors declares the same single breaking change: a **minimum Actions
# Runner of v2.327.1**. Nothing about their inputs changed for the way this
# file uses them.
#
# That floor is free on GitHub-hosted runners. It is a condition, not a
# problem, for the self-hosted Dom0 runner Level 2 is planned against: an
# older runner fails these actions outright rather than warning.
#
# **No self-hosted runner exists yet** — the repository had zero registered on
# 2026-09-02, so there is nothing to check today and no `run.sh` on Dom0 to
# check it with; that file only appears when a runner is installed. The
# current release is v2.337.0, well past the floor, so installing one now
# satisfies this by default. It matters only if Level 2 is ever wired to a
# runner that was installed and then left un-upgraded.
# ---------------------------------------------------------------------------

name: static checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      # The version `.shellcheckrc` was baselined against, named once so the
      # install and the assertion below cannot disagree. Changing it means
      # re-reading that baseline, not just bumping a number.
      SHELLCHECK_VERSION: "0.11.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        # Installed explicitly rather than relying on what the runner image
        # happens to ship. Two reasons: the GitHub-hosted image contents
        # change without notice, and Level 2 will run on a self-hosted Dom0
        # runner whose image is ours — this step is what makes the two
        # tiers agree on what "the static checks" means.
        #
        # **shellcheck is DOWNLOADED AT A PINNED VERSION, not apt-installed,
        # and that is what this job was missing.** `apt-get install shellcheck`
        # is precisely the "whatever the image ships" this comment claims not
        # to do: ubuntu-24.04 carries 0.9.0, while `.shellcheckrc` was
        # baselined against 0.11.0 and says so.
        #
        # The cost was six weeks of a permanently red gate. 0.9.0 raises SC2015
        # on network-setup.sh's `[ $# -ge 1 ] && [ $# -le 2 ] || fail ...`,
        # which 0.11.0 does not — the idiom is correct there, because the
        # middle term is a test rather than a command with side effects, and
        # the newer release narrowed the heuristic. Nothing was wrong with the
        # script.
        #
        # Worse than one false finding: the step's failure short-circuits
        # `perl -c`, the shebang convention check and the <USER> guard, so a
        # lint disagreement silently disabled three unrelated gates.
        #
        # Found 2026-09-02. The old comment anticipated a NEWER shellcheck
        # drifting; the one that actually bit was older.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dash perl xz-utils
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 0755 \
            "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck

      - name: Record toolchain versions
        # Recorded AND asserted. Recording alone is what this job did before,
        # and it did not help: the version was in every log of every red run
        # and nobody was reading the passing steps of a failing job.
        #
        # The assertion turns "mysterious lint findings on unmodified code"
        # into one line naming the cause. If it fires, the question is whether
        # to re-baseline `.shellcheckrc` against the new release — not to
        # unpin this.
        run: |
          shellcheck --version
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}" || {
            echo "FAIL: shellcheck is not ${SHELLCHECK_VERSION}, which is the"
            echo "      version .shellcheckrc was baselined against. Its"
            echo "      finding set differs between releases, so this gate"
            echo "      would be red or green for reasons unrelated to the code."
            exit 1
          }
          bash --version | head -1
          perl --version | sed -n 2p
          ls -l /bin/sh

      - name: Syntax — bash -n and dash -n
        # dash -n is not redundant. The automation/ worker scripts declare
        # #!/bin/sh and are interpreted by dash in production, so bash -n
        # alone accepts bashisms that fail silently there rather than
        # erroring — the defect issue #4 hit with ${BASH_SOURCE[0]}
        # evaluating to empty and turning SCRIPT_DIR into $PWD.
        run: |
          rc=0
          for f in automation/*.sh; do
            bash -n "$f" || { echo "FAIL bash -n $f"; rc=1; }
            dash -n "$f" || { echo "FAIL dash -n $f"; rc=1; }
          done
          exit $rc

      - name: shellcheck
        # Bare, with no severity flag: .shellcheckrc is read automatically
        # and is the single reviewable record of what the gate enforces.
        # Passing a flag here would diverge from what CONTRIBUTING.md tells
        # a developer to run locally, and `severity=` in that file is
        # silently ignored by shellcheck 0.11.0 anyway.
        run: shellcheck automation/*.sh

      - name: perl -c
        run: perl -c automation/clone.pl

      - name: Shebang layout convention
        # CONTRIBUTING.md, "Script layout convention": line 1 is the
        # shebang, licence header below it. shellcheck's SC1128 already
        # catches this and is NOT disabled in .shellcheckrc, but it is
        # asserted separately so the intent survives a future baseline
        # change that suppresses SC1128 by accident.
        run: |
          rc=0
          for f in automation/*.sh; do
            case "$(head -1 "$f")" in
              '#!'*) ;;
              *) echo "FAIL $f: line 1 is not a shebang"; rc=1 ;;
            esac
          done
          exit $rc

      - name: Regression guard — no <USER> placeholder
        # Issue #2: automation/ had silently diverged from the deployed Dom0
        # copies, and this repo's drakvuf-ubuntu.sh carried an unsubstituted
        # <USER>. Resolved 2026-08-08 by syncing from the tested host. This
        # guards against a half-substituted copy being committed again.
        #
        # Note the inverted exit status: grep returns 0 when it FINDS
        # something, so the failure case is a match. Written as an explicit
        # if-block rather than a bare command for exactly that reason — the
        # same defect the Android checklist's §6.1 gate carried.
        #
        # COMMENT LINES ARE EXCLUDED, and that is not a loophole. The first
        # run of this workflow failed on drakvuf-ubuntu.sh:145 — a comment
        # explaining what issue #2 found, which necessarily quotes the
        # placeholder it is about. A guard that forbids describing a bug is
        # a guard against documentation, and `CLAUDE.md` requires exactly
        # that kind of "why" comment. The pattern below requires the first
        # non-whitespace character of the line to not be `#`, so a real
        # placeholder in an assignment is still caught.
        run: |
          if grep -REn '^[[:space:]]*[^#[:space:]].*<USER>' automation/; then
            echo "FAIL: unsubstituted <USER> placeholder found in code"
            exit 1
          fi
          echo "OK: no <USER> placeholder outside comments"

      - name: Inventory — ps|grep process discovery
        # Informational, NOT a gate. These sites exist today and are owned
        # by DRAFT-011; failing on them would make this workflow red on
        # unmodified working code, which is the thing DRAFT-031 existed to
        # prevent. Turn this into a gate when DRAFT-011 lands.
        continue-on-error: true
        run: |
          echo "Known ps|grep sites (DRAFT-011 owns replacing these):"
          grep -Rns 'ps aux.*grep' automation/ || echo "none found"
  # -------------------------------------------------------------------------
  # Secrets. Runs on every push and PR, and scans HISTORY as well as the tree.
  #
  # The pre-push hook (.githooks/pre-push) is the fast local guard and only
  # scans the working tree. This is the backstop that catches a push made with
  # --no-verify, or from a clone that never ran
  # `git config core.hooksPath .githooks`.
  #
  # **A finding here is already worse than a finding locally.** By the time
  # this job runs the commit is on the remote, so the remedy is a history
  # rewrite AND rotating the credential, not an edit.
  # -------------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1 clone: a shallow checkout
          # would scan one commit and report clean, which is the failure mode
          # this whole job exists to avoid.
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          V=$(curl -fsSL https://api.github.com/repos/trufflesecurity/trufflehog/releases/latest \
              | grep -m1 '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trufflesecurity/trufflehog/releases/download/v$V/trufflehog_${V}_linux_amd64.tar.gz" \
              | tar xz -C "$HOME/.local/bin" trufflehog
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: TruffleHog + project-specific patterns
        # No --tree: this is the tier that scans history.
        run: scripts/check-secrets.sh

  # -------------------------------------------------------------------------
  # sandboxd. Needs no infrastructure, which is the property that lets it run
  # here at all — the platform suite requires Postgres and MinIO.
  #
  # This one command also runs all three generators and the reference checker
  # in --check mode, because the suite shells out to them. So a stale
  # docs/CURRENT-STATE.md, docs/INDEX.md or misc/*.cfg, or a dead
  # cross-reference, can no longer reach master through a PR.
  # -------------------------------------------------------------------------
  sandboxd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Dom0's own interpreter, which is where this code runs. Ubuntu
          # noble ships 3.12.
          #
          # **If the suite fails here it is a real finding, not a reason to
          # move to a newer runner.** docs/CURRENT-STATE.md 1.2 still records
          # Dom0's Python as UNCONFIRMED after the move from jammy to noble;
          # confirm it with `python3 -V` on the host and change this to match,
          # rather than the other way round.
          python-version: '3.12'

      - name: Install dependencies
        # **Both requirement files, and platform/ is not a mistake.**
        # `sandboxd/tests/test_api.py` validates what the client sends against
        # the SERVER's own pydantic models, imported from `sandbox_platform` —
        # so a shape change in `RegisterRequest` or `ClaimRequest` fails here
        # rather than, in that file's words, "at 3am on Dom0 against a platform
        # that was upgraded".
        #
        # So "needs no infrastructure" is true of *services* — no Postgres, no
        # MinIO, no running API — and not of *packages*. Installing only
        # sandboxd/requirements.txt fails collection with
        # `ModuleNotFoundError: No module named 'fastapi'`.
        run: |
          python -m pip install --upgrade pip
          pip install -r sandboxd/requirements.txt -r platform/requirements.txt pytest

      - name: pytest
        run: python -m pytest sandboxd/tests -q

  # -------------------------------------------------------------------------
  # platform. The ONLY safe home for this suite.
  #
  # Its `conn` fixture runs
  # `TRUNCATE jobs, worker_pipelines, workers RESTART IDENTITY CASCADE`, so it
  # destroys job history wherever it points. Here that is a throwaway service
  # container; on the deployment it is the record of every analysis ever run.
  # CLAUDE.md carries the standing rule, and it was attempted against the
  # deployment once already, on 2026-08-25.
  #
  # `mc` is absent and its three service-account policy tests skip loudly.
  #
  # The Playwright browser tests do NOT skip, which an earlier version of this
  # comment got wrong: they skip when the *package* is missing, and `playwright`
  # is in platform/requirements.txt, so what was missing was the browser binary
  # — 38 errors, not 38 skips. Chromium is installed below and cached. They are
  # the XSS-execution tests, which assert that a hostile filename is not
  # executed by a browser rendering the job page; on a malware-analysis platform
  # that is worth a cached download.
  # -------------------------------------------------------------------------
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: sandbox_platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The platform runs in its own DomU, not on Dom0, so it is not tied
          # to Dom0's interpreter the way sandboxd is.
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r platform/requirements.txt pytest

      - name: Start MinIO
        # **A `services:` block cannot do this**, and that is why it is a step.
        # GitHub Actions services accept `options` but no *command*, and
        # `minio/minio` needs `server /data` -- without it the container prints
        # its usage and exits, which the first version of this job did.
        #
        # MINIO_SITE_REGION must equal S3_REGION. The region is part of the
        # SigV4 signing scope, and without it MinIO accepts a signature scoped
        # to any region -- failing exactly one test,
        # test_objects.py::test_the_region_is_enforced, in a way that reads as a
        # code regression in whatever was just changed.
        #
        # Pinned, not `:latest`. This job asserts behaviour about signature
        # scoping; an image that moves under it turns a real regression and an
        # upstream change into the same red X.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=devroot \
            -e MINIO_ROOT_PASSWORD=devrootpass \
            -e MINIO_SITE_REGION=eu-central-1 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "minio healthy"; exit 0
            fi
            sleep 2
          done
          echo "minio did not become healthy"; docker logs minio; exit 1

      - name: Create the analysis bucket
        # `conftest.py` writes objects with `put_object` and never creates the
        # bucket -- on the deployment `minio/provision.sh` does that, and here
        # nothing would.
        run: |
          pip install boto3
          python - <<'PY'
          import boto3
          boto3.client("s3", endpoint_url="http://127.0.0.1:9000",
                       aws_access_key_id="devroot",
                       aws_secret_access_key="devrootpass",
                       region_name="eu-central-1").create_bucket(Bucket="analysis")
          print("bucket 'analysis' created")
          PY

      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pinned playwright version, so an upgrade fetches a new
          # browser instead of reusing one built for the old client.
          key: playwright-${{ hashFiles('platform/requirements.txt') }}

      - name: Install Chromium
        # --with-deps pulls the shared libraries a headless browser needs on a
        # bare runner. A no-op when the cache hit.
        run: python -m playwright install --with-deps chromium

      - name: pytest
        working-directory: platform
        # Only the database URL. Every S3 value conftest.py needs is already its
        # own default -- devroot/devrootpass/analysis/eu-central-1 against
        # 127.0.0.1:9000 -- and the first version of this job set `S3_ENDPOINT`,
        # which conftest does not read. It wants S3_INTERNAL_ENDPOINT and
        # S3_PUBLIC_ENDPOINT.
        env:
          TEST_DATABASE_URL: postgresql://platform:platform@localhost:5432/sandbox_platform_test
        run: python -m pytest -q
