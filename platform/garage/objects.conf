# The analysis object store's TLS front, and its capability filter.
#
# Installed as /etc/nginx/conf.d/objects.conf on the platform DomU. Runbook 18
# Part E. In the repository because this file carries a SECURITY PROPERTY of
# the platform -- see README.md, DECISION A2 -- and a security-relevant file
# with a test and no version control is the worst of the three states.
#
# **TWO jobs, and the second is not incidental.**
#
# 1. Garage serves plain HTTP and has no TLS listener, so TLS has to terminate
#    somewhere. This keeps the address, port and certificate MinIO served, so
#    api.env, the cloudflared ingress rule and every presigned URL already in
#    flight all stay correct -- SigV4 signs the Host header, so none of that
#    may move.
#
# 2. Garage's permission model is read/write/owner per key, where `read`
#    implies ListObjects and `write` implies DeleteObject, DeleteObjects and
#    CopyObject. MinIO's api-policy.json withheld ListBucket and DeleteObject
#    deliberately: so that a compromised API could not enumerate a store of
#    live malware, and could not be made destructive. **Garage cannot express
#    either absence.** They live here instead.
#
# `platform/garage/conformance.py` is the test for this file. Run it after any
# change, and read the `== what api-policy.json withheld` section: pointed at
# a store with no front in front of it, those checks go red, which is how we
# know they are checking something.
#
# **Three lines are host-specific** and nothing else is -- the `listen`
# address, the two `ssl_certificate*` paths, and the `upstream` port. A
# development copy differs in exactly those.
#
# **Drift check**, since the deployed copy and this one can diverge:
#
#     diff /etc/nginx/conf.d/objects.conf \
#          /opt/platform/src/platform/garage/objects.conf
#
# This is an `http`-level fragment: Debian includes conf.d/ inside `http {}`,
# which is what `map`, `log_format` and `upstream` below require. Including it
# anywhere else will not parse.

# Strip the query string before logging, leaving the raw, still-encoded path.
#
# **A presigned URL carries `X-Amz-Signature`**, so nginx's default `$request`
# would write live capabilities into a logfile that outlives their TTL and
# gets rotated to disk. And `$uri` is the DECODED path, so a sample named with
# a `%0A` would inject a newline into the log -- keys here are built from
# submitted filenames, which are attacker-controlled by definition.
# `$request_uri` minus its query is neither.
map $request_uri $request_path {
    "~^([^?]*)"  $1;
}

# The key name still reaches the log, and therefore outlives the bucket's
# retention rule by however long logrotate keeps it. That is a stated, bounded
# exposure -- the filename is already in the jobs table -- and it buys the
# ability to diagnose a 403. `access_log off;` is the lever if a retention
# position later says it must not be.
log_format objects '$remote_addr $status $request_method $request_path '
                   '$body_bytes_sent $request_time';

upstream garage_s3 {
    # HOST-SPECIFIC: Garage's own S3 listener, which binds loopback only.
    server 127.0.0.1:3900;
    keepalive 16;
}

server {
    # HOST-SPECIFIC. The port, address and certificate MinIO served.
    listen 192.168.1.10:9000 ssl;
    listen 127.0.0.1:9000 ssl;
    server_name 192.168.1.10 platform.lan localhost;

    access_log /var/log/nginx/objects.log objects;

    # HOST-SPECIFIC. Copied from MinIO's pair, so the SANs, the CA and
    # therefore Dom0's trust and cloudflared's caPool are all unchanged.
    ssl_certificate     /etc/nginx/tls/objects.crt;
    ssl_certificate_key /etc/nginx/tls/objects.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:objects:1m;

    # This listener serves one store and no pages; the version number in an
    # error body is of use to nobody who should be reaching it.
    server_tokens off;

    # SigV4 signs Host. Rewriting it invalidates every signature, and the 403
    # that follows talks about signatures and never about hosts.
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # An S3 request body IS the object. Buffering one would put a sample on
    # this domain's filesystem -- the one thing this domain must never do --
    # and would also break the POST policy's content-length-range, which
    # Garage enforces as the stream arrives.
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # CVE-2026-97731's shape: a presigned write carrying an unsigned
    # copy-source header, which turns one object's write capability into a read
    # of everything the signing key can reach. Garage rejects unsigned x-amz-*
    # headers itself (verify_signed_headers), so this is belt and braces -- and
    # it is what keeps the property if the store is ever swapped again.
    if ($http_x_amz_copy_source) { return 403; }

    # Multi-object delete is POST /analysis?delete, so the method filters
    # below do not see it. Keys are percent-encoded in the path, so this can
    # only ever match a real query parameter.
    if ($request_uri ~* "[?&]delete(=|&|$)") { return 403; }

    # The bucket root. A presigned POST targets exactly /analysis, with no
    # trailing slash; OPTIONS is the CORS preflight, which Garage answers from
    # the bucket's own rule. GET or HEAD here is ListObjects, which is the
    # thing that must not exist.
    location = /analysis {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://garage_s3;
    }

    # ListObjects with a trailing slash. Same refusal, no upstream call.
    location = /analysis/ { return 403; }

    # Object paths: read only. No PUT, so no CopyObject and no UploadPartCopy;
    # no DELETE; no POST, so no multipart. The platform needs none of them --
    # it writes through a presigned POST to the bucket root and reads with GET,
    # including ranges for the per-process log viewer.
    #
    # An unsigned GET of a real key is deliberately allowed THROUGH: Garage
    # answers it `403 AccessDenied, "Garage does not support anonymous access
    # yet"`. Reading the body is how the two layers are told apart when
    # debugging, and conformance.py asserts that distinction.
    location /analysis/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://garage_s3;
    }

    # Replaces /minio/health/live. Garage's admin /health needs no token and
    # answers 200 only while the node can actually serve requests -- a node
    # with no layout applied returns 503 -- so this is a readiness probe
    # rather than a liveness ping. LAN-only: the tunnel routes
    # ^/analysis(/|$) and nothing else to this port.
    location = /healthz {
        proxy_pass http://127.0.0.1:3903/health;
    }

    # Everything else -- ListBuckets at /, any other bucket, Garage's admin
    # API, and anything the store might grow later -- stops existing from the
    # LAN's point of view.
    location / { return 403; }
}
